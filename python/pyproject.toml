[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "read-anything"
version = "2.0.0"
description = "Read login-walled communities (Xiaohongshu, Zhihu, Weibo, CSDN, Tieba, Reddit, YouTube) from an AI agent over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "read-anything contributors" }]
keywords = ["mcp", "scraper", "agent", "xiaohongshu", "zhihu", "reddit", "browser"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = [
  "requests>=2.31",
  "pyyaml>=6.0",
  "lxml>=5.0",
  "websocket-client>=1.8",
  "yt-dlp>=2025.1",
  "python-jobspy>=1.1.80",
]

[project.optional-dependencies]
bilibili = ["yt-dlp"]

[project.urls]
Homepage = "https://github.com/poiuye-dotcom/read-anything"
Source = "https://github.com/poiuye-dotcom/read-anything"

[project.scripts]
read-anything = "read_anything.ra:main"
read-anything-mcp = "read_anything.mcp:main"

[tool.setuptools]
packages = ["read_anything"]
include-package-data = true

[tool.setuptools.package-data]
read_anything = ["sites.yaml", "queries.yaml"]
