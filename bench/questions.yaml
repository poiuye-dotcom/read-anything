# 计分规则：只有「网页搜索首页答不出来」的问题才算数。
# search_note 记录当时搜索返回了什么，用来证明它确实答不出来。
# expect 是一条正确答案里必须出现的关键词，用来判定命中。

questions:
  - q: "FPGA 现在就业到底什么行情"
    site: zhihu
    expect: ["FPGA"]
    search_note: "首页是培训机构招生页和 2021 年的旧文，没有近两个月的行情"

  - q: "嵌入式 30 岁以后还能干吗"
    site: zhihu
    expect: ["嵌入式"]
    search_note: "首页是招聘 JD 与泛泛的职业规划文，没有从业者的具体年龄叙事"

  - q: "IC 秋招 今年 有多难"
    site: zhihu
    expect: ["秋招"]
    search_note: "首页是 2023 年的分析文章，时效已过"

  - q: "数学一 真题 这个阶段该刷什么"
    site: tieba
    expect: ["真题"]
    search_note: "首页是教辅广告，没有人在这个月的进度讨论"

  - q: "Verilog 时序 亚稳态 怎么理解"
    site: csdn
    expect: ["时序"]
    search_note: "首页是百科式定义，缺少与具体代码绑定的解释"

  - q: "签了 offer 又想去另一家 怎么处理"
    site: zhihu
    expect: ["offer"]
    search_note: "首页是律所问答的通用条款，缺少真实操作细节"
